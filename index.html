<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StyleRadar · Descubre tu estilo en tu ciudad</title>
    <meta name="description" content="Encuentra prendas en tu talla en las tiendas locales de Bogotá, pruébatelas en el probador virtual y dale una segunda vida a tu ropa." />
    <meta name="theme-color" content="#262626" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Sistema de temas de 3 modos (Claro, Oscuro, Daltónico) anti-flicker script -->
    <script>
      (function() {
        try {
          var mode = localStorage.getItem('sr:theme-mode');
          var cvd = localStorage.getItem('sr:cvd') === 'true';
          if (!mode) {
            var legacy = localStorage.getItem('sr:tema');
            if (legacy === 'claro') mode = 'light';
            else if (legacy === 'oscuro') mode = 'dark';
            else if (legacy === 'daltonico') { mode = 'dark'; cvd = true; }
          }
          var systemDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          var resolved = (mode === 'light' || mode === 'dark') ? mode : (systemDark ? 'dark' : 'light');
          var el = document.documentElement;
          el.setAttribute('data-theme', cvd ? 'colorblind' : resolved);
          el.setAttribute('data-tema', resolved === 'light' ? 'claro' : 'oscuro');
          el.setAttribute('data-cvd', cvd ? 'on' : 'off');
          el.setAttribute('data-contrast', cvd ? 'on' : 'off');
          el.style.colorScheme = resolved;
        } catch (e) {}
      })();
    </script>
    <meta property="og:type" content="website" />
    <meta property="og:title" content="StyleRadar · Descubre tu estilo en tu ciudad" />
    <meta property="og:description" content="Moda local de Bogotá: busca, pruébate y encuentra tu talla cerca de ti." />
    <meta property="og:image" content="/img/og.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
