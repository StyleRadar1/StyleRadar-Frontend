<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="850" viewBox="0 0 1600 850"><rect width="1600" height="850" fill="#F8F7FA"/><rect width="1600" height="160" fill="#262626"/><rect width="22" height="850" fill="#48119A"/><text x="64" y="51" fill="#E8DCCB" font-family="Poppins,DejaVu Sans,sans-serif" font-size="21" font-weight="700" letter-spacing="2" text-anchor="start">STYLERADAR / FLUJO DE NAVEGACIÓN</text><text x="64" y="121" fill="#FFFFFF" font-family="Poppins,DejaVu Sans,sans-serif" font-size="50" font-weight="700" text-anchor="start">Comprador</text><rect x="1257" y="51" width="284" height="65" rx="20" fill="#48119A"/><text x="1281" y="91" fill="#FFFFFF" font-family="Poppins,DejaVu Sans,sans-serif" font-size="21" font-weight="700" text-anchor="start">02_comprador</text><text x="63" y="208" fill="#48119A" font-family="Poppins,DejaVu Sans,sans-serif" font-size="22" font-weight="800" letter-spacing="1" text-anchor="start">01  /  RECORRIDO PRINCIPAL</text><rect x="63.0" y="253" width="353.0" height="220" rx="18" fill="#E7E3EA"/><rect x="63.0" y="247" width="353.0" height="220" rx="18" fill="#FFFFFF" stroke="#E2DDE8"/><rect x="81.0" y="265" width="46" height="46" rx="10" fill="#48119A"/><text x="104.0" y="297" fill="#FFFFFF" font-family="Poppins,DejaVu Sans,sans-serif" font-size="21" font-weight="700" text-anchor="middle">01</text><text x="83.0" y="347" fill="#262626" font-family="Poppins,DejaVu Sans,sans-serif" font-size="27" font-weight="700" text-anchor="start">Iniciar sesión</text><text x="83.0" y="381.0" fill="#4A4A55" font-family="Poppins,DejaVu Sans,sans-serif" font-size="19" font-weight="400" text-anchor="start">Foto y color de usuario;</text><text x="83.0" y="407.6" fill="#4A4A55" font-family="Poppins,DejaVu Sans,sans-serif" font-size="19" font-weight="400" text-anchor="start">bienvenida «Hola de nuevo».</text><rect x="81.0" y="433" width="317.0" height="26" rx="13" fill="#EEE8F7"/><text x="93.0" y="452" fill="#48119A" font-family="Poppins,DejaVu Sans,sans-serif" font-size="15" font-weight="700" text-anchor="start">login  ·  bienvenida</text><path d="M418.0 357 h16" stroke="#48119A" stroke-width="4"/><path d="M434.0 349 v16" stroke="#48119A" stroke-width="4"/><rect x="438.0" y="253" width="353.0" height="220" rx="18" fill="#E7E3EA"/><rect x="438.0" y="247" width="353.0" height="220" rx="18" fill="#FFFFFF" stroke="#E2DDE8"/><rect x="456.0" y="265" width="46" height="46" rx="10" fill="#48119A"/><text x="479.0" y="297" fill="#FFFFFF" font-family="Poppins,DejaVu Sans,sans-serif" font-size="21" font-weight="700" text-anchor="middle">02</text><text x="458.0" y="347" fill="#262626" font-family="Poppins,DejaVu Sans,sans-serif" font-size="27" font-weight="700" text-anchor="start">Buscar y ubicar</text><text x="458.0" y="381.0" fill="#4A4A55" font-family="Poppins,DejaVu Sans,sans-serif" font-size="19" font-weight="400" text-anchor="start">Filtros por tipo, color, talla</text><text x="458.0" y="407.6" fill="#4A4A55" font-family="Poppins,DejaVu Sans,sans-serif" font-size="19" font-weight="400" text-anchor="start">y estilo; distancia en el mapa.</text><rect x="456.0" y="433" width="317.0" height="26" rx="13" fill="#EEE8F7"/><text x="468.0" y="452" fill="#48119A" font-family="Poppins,DejaVu Sans,sans-serif" font-size="15" font-weight="700" text-anchor="start">#/catalogo  ·  #/mapa</text><path d="M793.0 357 h16" stroke="#48119A" stroke-width="4"/><path d="M809.0 349 v16" stroke="#48119A" stroke-width="4"/><rect x="813.0" y="253" width="353.0" height="220" rx="18" fill="#E7E3EA"/><rect x="813.0" y="247" width="353.0" height="220" rx="18" fill="#FFFFFF" stroke="#E2DDE8"/><rect x="831.0" y="265" width="46" height="46" rx="10" fill="#48119A"/><text x="854.0" y="297" fill="#FFFFFF" font-family="Poppins,DejaVu Sans,sans-serif" font-size="21" font-weight="700" text-anchor="middle">03</text><text x="833.0" y="347" fill="#262626" font-family="Poppins,DejaVu Sans,sans-serif" font-size="27" font-weight="700" text-anchor="start">Probar y guardar</text><text x="833.0" y="381.0" fill="#4A4A55" font-family="Poppins,DejaVu Sans,sans-serif" font-size="19" font-weight="400" text-anchor="start">Maniquí o foto propia; wishlist</text><text x="833.0" y="407.6" fill="#4A4A55" font-family="Poppins,DejaVu Sans,sans-serif" font-size="19" font-weight="400" text-anchor="start">y playlists.</text><rect x="831.0" y="433" width="317.0" height="26" rx="13" fill="#EEE8F7"/><text x="843.0" y="452" fill="#48119A" font-family="Poppins,DejaVu Sans,sans-serif" font-size="15" font-weight="700" text-anchor="start">#/probador</text><path d="M1168.0 357 h16" stroke="#48119A" stroke-width="4"/><path d="M1184.0 349 v16" stroke="#48119A" stroke-width="4"/><rect x="1188.0" y="253" width="353.0" height="220" rx="18" fill="#E7E3EA"/><rect x="1188.0" y="247" width="353.0" height="220" rx="18" fill="#FFFFFF" stroke="#E2DDE8"/><rect x="1206.0" y="265" width="46" height="46" rx="10" fill="#48119A"/><text x="1229.0" y="297" fill="#FFFFFF" font-family="Poppins,DejaVu Sans,sans-serif" font-size="21" font-weight="700" text-anchor="middle">04</text><text x="1208.0" y="347" fill="#262626" font-family="Poppins,DejaVu Sans,sans-serif" font-size="27" font-weight="700" text-anchor="start">Segunda vida</text><text x="1208.0" y="381.0" fill="#4A4A55" font-family="Poppins,DejaVu Sans,sans-serif" font-size="19" font-weight="400" text-anchor="start">Publicar para vender o donar y</text><text x="1208.0" y="407.6" fill="#4A4A55" font-family="Poppins,DejaVu Sans,sans-serif" font-size="19" font-weight="400" text-anchor="start">acordar por chat.</text><rect x="1206.0" y="433" width="317.0" height="26" rx="13" fill="#EEE8F7"/><text x="1218.0" y="452" fill="#48119A" font-family="Poppins,DejaVu Sans,sans-serif" font-size="15" font-weight="700" text-anchor="start">#/vender  ·  #/mensajes</text><text x="63" y="515" fill="#48119A" font-family="Poppins,DejaVu Sans,sans-serif" font-size="22" font-weight="800" letter-spacing="1" text-anchor="start">02  /  DECISIONES, ERRORES Y ALCANCE</text><rect x="63" y="548" width="482" height="210" rx="18" fill="#EEE8F7"/><text x="85" y="591" fill="#48119A" font-family="Poppins,DejaVu Sans,sans-serif" font-size="21" font-weight="700" text-anchor="start">ACCESO / ALTERNATIVA</text><text x="85" y="633.0" fill="#262626" font-family="Poppins,DejaVu Sans,sans-serif" font-size="19" font-weight="400" text-anchor="start">El botón de cuenta dice «Usuario» con punto</text><text x="85" y="659.6" fill="#262626" font-family="Poppins,DejaVu Sans,sans-serif" font-size="19" font-weight="400" text-anchor="start">violeta. Su menú lleva a perfil, playlists,</text><text x="85" y="686.2" fill="#262626" font-family="Poppins,DejaVu Sans,sans-serif" font-size="19" font-weight="400" text-anchor="start">publicaciones y alertas.</text><rect x="567" y="548" width="482" height="210" rx="18" fill="#E8DCCB"/><text x="589" y="591" fill="#262626" font-family="Poppins,DejaVu Sans,sans-serif" font-size="21" font-weight="700" text-anchor="start">ERROR / ESTADO VACÍO</text><text x="589" y="633.0" fill="#262626" font-family="Poppins,DejaVu Sans,sans-serif" font-size="19" font-weight="400" text-anchor="start">Sin foto, el probador ofrece «Cargar foto» o</text><text x="589" y="659.6" fill="#262626" font-family="Poppins,DejaVu Sans,sans-serif" font-size="19" font-weight="400" text-anchor="start">«Usar foto de ejemplo». Los errores salen</text><text x="589" y="686.2" fill="#262626" font-family="Poppins,DejaVu Sans,sans-serif" font-size="19" font-weight="400" text-anchor="start">junto a cada campo.</text><rect x="1071" y="548" width="482" height="210" rx="18" fill="#E4ECE6"/><text x="1093" y="591" fill="#262626" font-family="Poppins,DejaVu Sans,sans-serif" font-size="21" font-weight="700" text-anchor="start">ALCANCE</text><text x="1093" y="633.0" fill="#262626" font-family="Poppins,DejaVu Sans,sans-serif" font-size="19" font-weight="400" text-anchor="start">Datos de prueba en el navegador. El probador</text><text x="1093" y="659.6" fill="#262626" font-family="Poppins,DejaVu Sans,sans-serif" font-size="19" font-weight="400" text-anchor="start">es una aproximación por capas, no</text><text x="1093" y="686.2" fill="#262626" font-family="Poppins,DejaVu Sans,sans-serif" font-size="19" font-weight="400" text-anchor="start">inteligencia artificial.</text><text x="63" y="812" fill="#55555F" font-family="Poppins,DejaVu Sans,sans-serif" font-size="18" font-weight="400" text-anchor="start">Fuente: prototipo en public/prototipo · rutas del router hash · noviembre de 2026.</text></svg>