"833.0" y="381.0" fill="#4A4A55" font-family="Poppins,DejaVu Sans,sans-serif" font-size="19" font-weight="400" text-anchor="start">Catálogo, categorías por</text><text x="833.0" y="407.6" fill="#4A4A55" font-family="Poppins,DejaVu Sans,sans-serif" font-size="19" font-weight="400" text-anchor="start">personaje, mapa y tiendas.</text><rect x="831.0" y="433" width="317.0" height="26" rx="13" fill="#EEE8F7"/><text x="843.0" y="452" fill="#48119A" font-family="Poppins,DejaVu Sans,sans-serif" font-size="15" font-weight="700" text-anchor="start">#/catalogo  ·  #/mapa</text><path d="M1168.0 357 h16" stroke="#48119A" stroke-width="4"/><path d="M1184.0 349 v16" stroke="#48119A" stroke-width="4"/><rect x="1188.0" y="253" width="353.0" height="220" rx="18" fill="#E7E3EA"/><rect x="1188.0" y="247" width="353.0" height="220" rx="18" fill="#FFFFFF" stroke="#E2DDE8"/><rect x="1206.0" y="265" width="46" height="46" rx="10" fill="#48119A"/><text x="1229.0" y="297" fill="#FFFFFF" font-family="Poppins,DejaVu Sans,sans-serif" font-size="21" font-weight="700" text-anchor="middle">04</text><text x="1208.0" y="347" fill="#262626" font-family="Poppins,DejaVu Sans,sans-serif" font-size="27" font-weight="700" text-anchor="start">Acción personal</text><text x="1208.0" y="381.0" fill="#4A4A55" font-family="Poppins,DejaVu Sans,sans-serif" font-size="19" font-weight="400" text-anchor="start">Guardar, publicar, escribir o</text><text x="1208.0" y="407.6" fill="#4A4A55" font-family="Poppins,DejaVu Sans,sans-serif" font-size="19" font-weight="400" text-anchor="start">probar pide iniciar sesión.</text><rect x="1206.0" y="433" width="317.0" height="26" rx="13" fill="#EEE8F7"/><text x="1218.0" y="452" fill="#48119A" font-family="Poppins,DejaVu Sans,sans-serif" font-size="15" font-weight="700" text-anchor="start">login con foto</text><text x="63" y="515" fill="#48119A" font-family="Poppins,DejaVu Sans,sans-serif" font-size="22" font-weight="800" letter-spacing="1" text-anchor="start">02  /  DECISIONES, ERRORES Y ALCANCE</text><rect x="63" y="548" width="482" height="210" rx="18" fill="#EEE8F7"/><text x="85" y="591" fill="#48119A" font-family="Poppins,DejaVu Sans,sans-serif" font-size="21" font-weight="700" text-anchor="start">ACCESO / ALTERNATIVA</text><text x="85" y="633.0" fill="#262626" font-family="Poppins,DejaVu Sans,sans-serif" font-size="19" font-weight="400" text-anchor="start">«Iniciar sesión» en el landing abre el login</text><text x="85" y="659.6" fill="#262626" font-family="Poppins,DejaVu Sans,sans-serif" font-size="19" font-weight="400" text-anchor="start">sin pasar por la app. El landing vuelve solo</text><text x="85" y="686.2" fill="#262626" font-family="Poppins,DejaVu Sans,sans-serif" font-size="19" font-weight="400" text-anchor="start">en una pestaña nueva.</text><rect x="567" y="548" width="482" height="210" rx="18" fill="#E8DCCB"/><text x="589" y="591" fill="#262626" font-family="Poppins,DejaVu Sans,sans-serif" font-size="21" font-weight="700" text-anchor="start">ERROR / ESTADO VACÍO</text><text x="589" y="633.0" fill="#262626" font-family="Poppins,DejaVu Sans,sans-serif" font-size="19" font-weight="400" text-anchor="start">Una búsqueda sin resultados muestra un</text><text x="589" y="659.6" fill="#262626" font-family="Poppins,DejaVu Sans,sans-serif" font-size="19" font-weight="400" text-anchor="start">estado vacío. Una ruta privada muestra un</text><text x="589" y="686.2" fill="#262626" font-family="Poppins,DejaVu Sans,sans-serif" font-size="19" font-weight="400" text-anchor="start">aviso y abre el login.</text><rect x="1071" y="548" width="482" height="210" rx="18" fill="#E4ECE6"/><text x="1093" y="591" fill="#262626" font-family="Poppins,DejaVu Sans,sans-serif" font-size="21" font-weight="700" text-anchor="start">ALCANCE</text><text x="1093" y="633.0" fill="#262626" font-family="Poppins,DejaVu Sans,sans-serif" font-size="19" font-weight="400" text-anchor="start">El invitado no usa el probador ni envía</text><text x="1093" y="659.6" fill="#262626" font-family="Poppins,DejaVu Sans,sans-serif" font-size="19" font-weight="400" text-anchor="start">mensajes. Los personajes son estilos, no</text><text x="1093" y="686.2" fill="#262626" font-family="Poppins,DejaVu Sans,sans-serif" font-size="19" font-weight="400" text-anchor="start">filtros de producto.</text><text x="63" y="812" fill="#55555F" font-family="Poppins,DejaVu Sans,sans-serif" font-size="18" font-weight="400" text-anchor="start">Fuente: prototipo en public/prototipo · rutas del router hash · noviembre de 2026.</text></svg>