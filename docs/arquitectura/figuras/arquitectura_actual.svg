<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="814" viewBox="0 0 1600 814"><rect width="1600" height="814" fill="#F8F7FA"/><rect width="1600" height="102" fill="#262626"/><text x="40" y="66" fill="#FFFFFF" font-family="Poppins,DejaVu Sans,sans-serif" font-size="40" font-weight="700" text-anchor="start">STYLERADAR / ARQUITECTURA ACTUAL</text><rect x="78" y="144" width="1444" height="122" rx="18" fill="#EEE8F7"/><text x="106" y="190" fill="#48119A" font-family="Poppins,DejaVu Sans,sans-serif" font-size="27" font-weight="700" text-anchor="start">APLICACIÓN REACT</text><text x="106" y="228.0" fill="#262626" font-family="Poppins,DejaVu Sans,sans-serif" font-size="21" font-weight="400" text-anchor="start">src/ · Vite + React 19 + TypeScript + Tailwind. Router con rutas por rol, base</text><text x="106" y="257.4" fill="#262626" font-family="Poppins,DejaVu Sans,sans-serif" font-size="21" font-weight="400" text-anchor="start">común y un módulo por squad.</text><rect x="1210" y="180" width="276" height="46" rx="12" fill="#262626"/><text x="1230" y="210" fill="#FFFFFF" font-family="Poppins,DejaVu Sans,sans-serif" font-size="19" font-weight="700" text-anchor="start">REACT / VITE</text><path d="M800.0 266 v26" stroke="#48119A" stroke-width="4"/><path d="M792.0 284 l8 10 l8 -10" fill="#48119A"/><rect x="78" y="300" width="1444" height="122" rx="18" fill="#E8DCCB"/><text x="106" y="346" fill="#48119A" font-family="Poppins,DejaVu Sans,sans-serif" font-size="27" font-weight="700" text-anchor="start">SERVICIOS DEL FRONT</text><text x="106" y="384.0" fill="#262626" font-family="Poppins,DejaVu Sans,sans-serif" font-size="21" font-weight="400" text-anchor="start">Cada módulo llama a sus servicios. Con VITE_USE_MOCKS=true responden con datos de</text><text x="106" y="413.4" fill="#262626" font-family="Poppins,DejaVu Sans,sans-serif" font-size="21" font-weight="400" text-anchor="start">prueba.</text><rect x="1210" y="336" width="276" height="46" rx="12" fill="#262626"/><text x="1230" y="366" fill="#FFFFFF" font-family="Poppins,DejaVu Sans,sans-serif" font-size="19" font-weight="700" text-anchor="start">MOCKS / AXIOS</text><path d="M800.0 422 v26" stroke="#48119A" stroke-width="4"/><path d="M792.0 440 l8 10 l8 -10" fill="#48119A"/><rect x="78" y="456" width="1444" height="122" rx="18" fill="#ECEEF7"/><text x="106" y="502" fill="#48119A" font-family="Poppins,DejaVu Sans,sans-serif" font-size="27" font-weight="700" text-anchor="start">PROTOTIPO DE REFERENCIA</text><text x="106" y="540.0" fill="#262626" font-family="Poppins,DejaVu Sans,sans-serif" font-size="21" font-weight="400" text-anchor="start">public/prototipo · HTML, 8 hojas CSS y 21 scripts con router hash. Es la guía de</text><text x="106" y="569.4" fill="#262626" font-family="Poppins,DejaVu Sans,sans-serif" font-size="21" font-weight="400" text-anchor="start">diseño de todas las vistas.</text><rect x="1210" y="492" width="276" height="46" rx="12" fill="#262626"/><text x="1230" y="522" fill="#FFFFFF" font-family="Poppins,DejaVu Sans,sans-serif" font-size="19" font-weight="700" text-anchor="start">HTML / CSS / JS</text><path d="M800.0 578 v26" stroke="#48119A" stroke-width="4"/><path d="M792.0 596 l8 10 l8 -10" fill="#48119A"/><rect x="78" y="612" width="1444" height="122" rx="18" fill="#E4ECE6"/><text x="106" y="658" fill="#48119A" font-family="Poppins,DejaVu Sans,sans-serif" font-size="27" font-weight="700" text-anchor="start">DATOS</text><text x="106" y="696.0" fill="#262626" font-family="Poppins,DejaVu Sans,sans-serif" font-size="21" font-weight="400" text-anchor="start">Datos de prueba en el navegador (localStorage). Todavía no hay conexión con el API</text><text x="106" y="725.4" fill="#262626" font-family="Poppins,DejaVu Sans,sans-serif" font-size="21" font-weight="400" text-anchor="start">Gateway.</text><rect x="1210" y="648" width="276" height="46" rx="12" fill="#262626"/><text x="1230" y="678" fill="#FFFFFF" font-family="Poppins,DejaVu Sans,sans-serif" font-size="19" font-weight="700" text-anchor="start">SIN API REAL</text><text x="78" y="784" fill="#55555F" font-family="Poppins,DejaVu Sans,sans-serif" font-size="19" font-weight="400" text-anchor="start">ACTUAL: React con la estructura por módulos y el prototipo como referencia; integración con el backend pendiente.</text></svg>