<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1140" viewBox="0 0 1600 1140"><rect width="1600" height="1140" fill="#F8F7FA"/><rect width="1600" height="102" fill="#262626"/><text x="40" y="66" fill="#FFFFFF" font-family="Poppins,DejaVu Sans,sans-serif" font-size="40" font-weight="700" text-anchor="start">STYLERADAR / ARQUITECTURA OBJETIVO</text><rect x="78" y="144" width="1444" height="156" rx="18" fill="#EEE8F7"/><text x="106" y="190" fill="#48119A" font-family="Poppins,DejaVu Sans,sans-serif" font-size="27" font-weight="700" text-anchor="start">FRONTEND REACT</text><text x="106" y="228.0" fill="#262626" font-family="Poppins,DejaVu Sans,sans-serif" font-size="21" font-weight="400" text-anchor="start">Módulos identidad, catalogo, experiencia, transacciones y soporte sobre la base</text><text x="106" y="257.4" fill="#262626" font-family="Poppins,DejaVu Sans,sans-serif" font-size="21" font-weight="400" text-anchor="start">común (core).</text><rect x="1210" y="180" width="276" height="46" rx="12" fill="#262626"/><text x="1230" y="210" fill="#FFFFFF" font-family="Poppins,DejaVu Sans,sans-serif" font-size="19" font-weight="700" text-anchor="start">StyleRadar-Frontend</text><path d="M800.0 300 v26" stroke="#48119A" stroke-width="4"/><path d="M792.0 318 l8 10 l8 -10" fill="#48119A"/><rect x="78" y="334" width="1444" height="156" rx="18" fill="#E8DCCB"/><text x="106" y="380" fill="#48119A" font-family="Poppins,DejaVu Sans,sans-serif" font-size="27" font-weight="700" text-anchor="start">CLIENTE HTTP</text><text x="106" y="418.0" fill="#262626" font-family="Poppins,DejaVu Sans,sans-serif" font-size="21" font-weight="400" text-anchor="start">apiClient (Axios): URL del gateway por ambiente, token JWT en cada petición y</text><text x="106" y="447.4" fill="#262626" font-family="Poppins,DejaVu Sans,sans-serif" font-size="21" font-weight="400" text-anchor="start">errores normalizados.</text><rect x="1210" y="370" width="276" height="46" rx="12" fill="#262626"/><text x="1230" y="400" fill="#FFFFFF" font-family="Poppins,DejaVu Sans,sans-serif" font-size="19" font-weight="700" text-anchor="start">AXIOS + JWT</text><path d="M800.0 490 v26" stroke="#48119A" stroke-width="4"/><path d="M792.0 508 l8 10 l8 -10" fill="#48119A"/><rect x="78" y="524" width="1444" height="156" rx="18" fill="#ECEEF7"/><text x="106" y="570" fill="#48119A" font-family="Poppins,DejaVu Sans,sans-serif" font-size="27" font-weight="700" text-anchor="start">API GATEWAY</text><text x="106" y="608.0" fill="#262626" font-family="Poppins,DejaVu Sans,sans-serif" font-size="21" font-weight="400" text-anchor="start">Único punto de entrada del front: enruta a cada microservicio y valida el token.</text><rect x="1210" y="560" width="276" height="46" rx="12" fill="#262626"/><text x="1230" y="590" fill="#FFFFFF" font-family="Poppins,DejaVu Sans,sans-serif" font-size="19" font-weight="700" text-anchor="start">sr-api-gateway</text><path d="M800.0 680 v26" stroke="#48119A" stroke-width="4"/><path d="M792.0 698 l8 10 l8 -10" fill="#48119A"/><rect x="78" y="714" width="1444" height="156" rx="18" fill="#E4ECE6"/><text x="106" y="760" fill="#48119A" font-family="Poppins,DejaVu Sans,sans-serif" font-size="27" font-weight="700" text-anchor="start">MICROSERVICIOS</text><text x="106" y="798.0" fill="#262626" font-family="Poppins,DejaVu Sans,sans-serif" font-size="21" font-weight="400" text-anchor="start">CADCHE (Authentication, Usuarios, Tiendas) · RST (ItemCatalog, Inventory,</text><text x="106" y="827.4" fill="#262626" font-family="Poppins,DejaVu Sans,sans-serif" font-size="21" font-weight="400" text-anchor="start">Geolocation, Playlist) · PT8080 (VirtualTryOn, Donations) · Pagos · GJ</text><text x="106" y="856.8" fill="#262626" font-family="Poppins,DejaVu Sans,sans-serif" font-size="21" font-weight="400" text-anchor="start">(Notification, Chat, Estadísticas).</text><rect x="1210" y="750" width="276" height="46" rx="12" fill="#262626"/><text x="1230" y="780" fill="#FFFFFF" font-family="Poppins,DejaVu Sans,sans-serif" font-size="19" font-weight="700" text-anchor="start">SPRING BOOT</text><path d="M800.0 870 v26" stroke="#48119A" stroke-width="4"/><path d="M792.0 888 l8 10 l8 -10" fill="#48119A"/><rect x="78" y="904" width="1444" height="156" rx="18" fill="#F1ECE4"/><text x="106" y="950" fill="#48119A" font-family="Poppins,DejaVu Sans,sans-serif" font-size="27" font-weight="700" text-anchor="start">MENSAJERÍA Y DATOS</text><text x="106" y="988.0" fill="#262626" font-family="Poppins,DejaVu Sans,sans-serif" font-size="21" font-weight="400" text-anchor="start">RabbitMQ para eventos entre servicios y una base de datos PostgreSQL por servicio.</text><rect x="1210" y="940" width="276" height="46" rx="12" fill="#262626"/><text x="1230" y="970" fill="#FFFFFF" font-family="Poppins,DejaVu Sans,sans-serif" font-size="19" font-weight="700" text-anchor="start">RABBITMQ / POSTGRES</text><text x="78" y="1110" fill="#55555F" font-family="Poppins,DejaVu Sans,sans-serif" font-size="19" font-weight="400" text-anchor="start">OBJETIVO: el front solo habla con el gateway; cada squad conecta las vistas de sus propios microservicios.</text></svg>